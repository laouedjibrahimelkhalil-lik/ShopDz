<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopDz - تصفح الفئة</title>
    <!-- خط Tajawal من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- ملف التنسيقات الرئيسي -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Supabase وسكريبت الاتصال السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body>

    <!-- الهيدر وشريط التصفح (مطابق تماماً للرئيسية) -->
    <header class="main-header">
        <div class="container header-container">
            <!-- الشعار -->
            <a href="index.html" class="logo">Shop<span>Dz</span></a>

            <!-- شريط البحث -->
            <div class="search-box">
                <input type="text" id="searchInput" data-i18n="searchPlaceholder" placeholder="ابحث عن منتج داخل هذه الفئة...">
                <button type="submit" id="searchBtn" data-i18n="searchBtn">بحث</button>
            </div>

            <!-- أزرار التفاعل (اللغة + الحساب + السلة) -->
            <div class="header-actions" style="display: flex; align-items: center; gap: 10px;">
                <!-- قائمة اختيار اللغة -->
                <div class="language-switcher">
                    <select id="languageSelector" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--gray-border); background: #fff; font-family: inherit; font-size: 0.9rem; cursor: pointer;">
                        <option value="ar">العربية 🇩🇿</option>
                        <option value="en">English 🇬🇧</option>
                        <option value="fr">Français 🇫🇷</option>
                    </select>
                </div>

                <a href="login.html" class="action-btn" title="حسابي">
                    <span class="icon">👤</span>
                    <span class="text" data-i18n="login">دخول</span>
                </a>
                <a href="cart.html" class="action-btn cart-btn" title="سلة التسوق">
                    <span class="icon">🛒</span>
                    <span class="badge" id="cartBadge">0</span>
                    <span class="text" data-i18n="cart">السلة</span>
                </a>
                <!-- زر القائمة للهواتف -->
                <button class="mobile-toggle-btn" id="mobileMenuBtn" aria-label="فتح القائمة">
                    ☰
                </button>
            </div>
        </div>

        <!-- شريط التنقل الرئيسي (يتحدث ديناميكياً من Supabase عبر main.js) -->
        <nav class="nav-bar" id="navBar">
            <div class="container">
                <ul class="nav-links">
                    <!-- الفئات تضاف هنا تلقائياً بواسطة main.js -->
                </ul>
            </div>
        </nav>
    </header>

    <!-- محتوى صفحة الفئة -->
    <main class="section" style="min-height: 65vh; padding: 40px 0;">
        <div class="container">
            
            <!-- ترويسة الفئة وزر العودة -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; background: #f8fafc; padding: 20px 25px; border-radius: 12px; border: 1px solid var(--gray-border);">
                <div>
                    <span style="font-size: 0.85rem; color: #2563eb; font-weight: 700;">📂 قسم الفئات</span>
                    <h1 class="section-title" id="categoryPageTitle" style="margin: 5px 0 0 0; font-size: 1.8rem; color: #1e293b;">منتجات الفئة</h1>
                </div>
                <a href="index.html" class="btn btn-outline" style="padding: 10px 18px; border-radius: 8px; font-weight: 700; text-decoration: none;">← العودة إلى الصفحة الرئيسية</a>
            </div>

            <!-- شبكة عرض جميع منتجات هذه الفئة -->
            <div class="products-grid" id="productsGrid">
                <!-- المنتجات تظهر هنا تلقائياً -->
            </div>
        </div>
    </main>

    <!-- الفوتر البسيط -->
    <footer style="background: #1e293b; color: #94a3b8; text-align: center; padding: 25px 0; margin-top: 50px;">
        <div class="container">
            <p style="margin: 0; font-size: 0.95rem;">جميع الحقوق محفوظة &copy; 2026 <strong>ShopDz</strong> - متجرك الإلكتروني في الجزائر 🇩🇿</p>
        </div>
    </footer>

    <!-- ملفات الجافاسكريبت للترجمة والمنطق -->
    <script src="translations.js"></script>
    <script src="language.js"></script>
    <script src="main.js"></script>
</body>
</html>
