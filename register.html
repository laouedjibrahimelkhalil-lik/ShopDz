<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="adminRegPageTitle">ShopDz - تسجيل حساب مسؤول جديد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Supabase وسكريبت الاتصال السحابي -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <!-- قائمة اختيار اللغة في أعلى البطاقة -->
            <div class="language-switcher" style="margin-bottom: 15px; display: flex; justify-content: flex-end;">
                <select id="languageSelector" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--gray-border); background: #fff; font-family: inherit; font-size: 0.9rem; cursor: pointer;">
                    <option value="ar">العربية 🇩🇿</option>
                    <option value="en">English 🇬🇧</option>
                    <option value="fr">Français 🇫🇷</option>
                </select>
            </div>

            <a href="index.html" class="logo auth-logo">Shop<span>Dz</span></a>
            <h1 class="auth-title" data-i18n="adminRegTitle">إضافة مسؤول جديد</h1>
            <p class="auth-subtitle" data-i18n="adminRegSubtitle">أنشئ حساباً إدارياً جديداً للتحكم بالمتجر</p>

            <form id="registerForm" class="dash-form">
                <div class="form-group">
                    <label for="regName" data-i18n="adminNameLabel">اسم المسؤول *</label>
                    <input type="text" id="regName" data-i18n="adminNamePlaceholder" placeholder="الاسم الكامل" required>
                </div>

                <div class="form-group">
                    <label for="regEmail" data-i18n="emailLabel">البريد الإلكتروني *</label>
                    <input type="email" id="regEmail" placeholder="admin@shopdz.com" required style="direction: ltr; text-align: left;">
                </div>

                <div class="form-group">
                    <label for="regPassword" data-i18n="passwordLabel">كلمة المرور *</label>
                    <input type="password" id="regPassword" placeholder="********" required style="direction: ltr; text-align: left;">
                </div>

                <button type="submit" class="btn btn-primary btn-block" data-i18n="regSubmitBtn">حفظ الحساب وتسجيل الدخول</button>
            </form>

            <div class="auth-footer-links">
                <p>
                    <span data-i18n="alreadyHaveAccount">لديك حساب بالفعل؟</span> 
                    <a href="login.html" data-i18n="loginLinkText">تسجيل الدخول</a>
                </p>
                <p><a href="index.html" data-i18n="backToStore">← العودة إلى واجهة المتجر</a></p>
            </div>
        </div>
    </div>

    <!-- استدعاء ملفات الترجمة واللغة والمنطق -->
    <!-- ملاحظة: إذا كانت ملفات الجافاسكريبت داخل مجلد js/، أضف js/ قبل اسم كل ملف -->
    <script src="translations.js"></script>
    <script src="language.js"></script>
    <script src="auth.js"></script>
</body>
</html>
